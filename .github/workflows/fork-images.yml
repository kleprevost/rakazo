name: fork-images

# The fork's only CI: build and push the `app` and `computer` images (linux/amd64) to GHCR on every
# push to main. Upstream's workflows are left untouched (so syncs stay conflict-free) and are
# disabled in the repository's Actions UI instead. Every main commit gets a `sha-<full commit>` image
# straight away; the moving `edge` tag is only retagged from it once the fast test gate passes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # docker/metadata-action otherwise truncates commit tags to seven collision-prone characters.
  DOCKER_METADATA_SHORT_SHA_LENGTH: 40

concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate (typecheck plus the unit suites that need no database or browser). It runs in
  # parallel with the image builds, so a deployable sha- image exists even if it fails.
  gate:
    name: Test gate
    if: github.repository != 'elie222/rakazo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Typecheck
        run: >-
          pnpm exec turbo check
          --filter=@rakazo/api --filter=@rakazo/web --filter=@rakazo/worker
          --filter=@rakazo/adapters --filter=@rakazo/core --filter=@rakazo/contracts
          --filter=@rakazo/db --filter=@rakazo/testkit
      - name: Unit tests without database or browser
        # Two host-computer tests that signal background process groups ("cancel/revoke owns
        # background children...") fail in process-isolated sandboxes, so they are skipped by name.
        run: >-
          pnpm exec vitest run packages/core packages/contracts packages/adapters/src
          --testNamePattern '^(?!.*owns background children after their shell request finishes)'
        env:
          DATABASE_URL: ""
          COPY_TEST_DATABASE: ""

  image:
    name: Build ${{ matrix.name }} image
    if: github.repository != 'elie222/rakazo'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: infra/compose/Dockerfile
            context: .
          - name: computer
            dockerfile: infra/sandboxes/computer/Dockerfile
            context: infra/sandboxes/computer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GET /health reports the exact source commit.
          build-args: ${{ matrix.name == 'app' && format('GIT_SHA={0}', github.sha) || '' }}
          cache-from: type=gha,scope=fork-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=fork-${{ matrix.name }}

  # Moves `edge` to the tested commit's images: only after both builds and the gate succeed.
  promote:
    name: Move edge tag
    needs: [gate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag sha to edge
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository }}
        run: |
          for name in app computer; do
            docker buildx imagetools create \
              --tag "$IMAGE_BASE/$name:edge" \
              "$IMAGE_BASE/$name:sha-$GITHUB_SHA"
          done
