# Template only; not part of kustomization.yaml. Copy it outside the repository, fill in generated
# values, apply it with kubectl, and never commit the filled copy:
#   kubectl apply -f rakazo-secrets.yaml
# Generate random values with `openssl rand -hex 32`. SCREEN_PROXY_SECRET and BETTER_AUTH_SECRET
# must differ from each other. API and worker both read this Secret; the web pod reads only
# SCREEN_PROXY_SECRET.
apiVersion: v1
kind: Secret
metadata:
  name: rakazo-secrets
  namespace: rakazo
type: Opaque
stringData:
  # Private access only, so the host is a name inside the VNet (postgresHost output). rakazo_app
  # is created by the migrate Job with this password; the owner login is the Bicep admin login.
  DATABASE_URL: postgres://rakazo_app:<app-password>@<postgres-host>:5432/rakazo?sslmode=require
  DATABASE_MIGRATION_URL: postgres://<admin-login>:<admin-password>@<postgres-host>:5432/rakazo?sslmode=require
  BETTER_AUTH_SECRET: <openssl rand -hex 32>
  ENCRYPTION_KEY: <openssl rand -hex 32>
  SCREEN_PROXY_SECRET: <openssl rand -hex 32>
  OIDC_CLIENT_SECRET: <entra client secret value>
  # Foundry (docs/enterprise/inference.md). Remove if you use another provider.
  AZURE_OPENAI_API_KEY: <foundry key>
