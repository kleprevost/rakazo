# Azure Files (SMB) through the CSI driver AKS ships. The mount options make files belong to uid
# 1000, the user the app image runs as.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rakazo-files
provisioner: file.csi.azure.com
parameters:
  skuName: Premium_LRS
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - dir_mode=0770
  - file_mode=0660
  - uid=1000
  - gid=1000
  - mfsymlinks
  - cache=strict
  - nosharesock
  - actimeo=30
